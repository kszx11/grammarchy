name: Runtime provenance

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'contrib/verify-udpipe-runtime.sh'
      - 'docs/BUILD_PROVENANCE.md'
      - '.github/workflows/runtime-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'contrib/verify-udpipe-runtime.sh'
      - 'docs/BUILD_PROVENANCE.md'
      - '.github/workflows/runtime-provenance.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify the upstream runtime artifact
        run: bash contrib/verify-udpipe-runtime.sh
